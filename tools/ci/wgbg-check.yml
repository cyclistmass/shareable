name: wgbg release check

# release_check.sh's device steps on GitHub's runners instead of our emulators (Mauro, 2026-10-21: runners carry the
# device testing). Pushing a test/<name> branch runs it; `STEPS=remote tools/release_check.sh` waits for the run and prints
# the same PASS/FAIL report. Delete the branch afterwards. Locally only unit, rules and the by-hand user test remain.
# Lives in shareable's .github/workflows; drafted in catan-android tools/ci/.
on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same test branch replaces the run in progress.
concurrency:
  group: wgbg-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: working-german-board-game

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-37.0" "build-tools;36.1.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the instrumented tests' compile
        run: bash ./gradlew --no-daemon :engine:test :ai:test :net:test :cli:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

  firestore-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rules tests, with the replay of the app's real writes
        run: |
          npm ci --prefix firebase/rules-test
          npm install --global firebase-tools@15.33.0
          firebase emulators:exec --only firestore --project demo-wgbg "npm --prefix firebase/rules-test test"

  # Every device step release_check ran on our two lanes, one emulator per shard: 16 shards plus apk, unit and rules
  # make 19 jobs, so one check fits the 20 free concurrent jobs; a second check at once queues behind it.
  device:
    uses: ./.github/workflows/wgbg-device.yml
    secrets: inherit
    with:
      shards: >-
        [{"shard":"monkey","minutes":30},{"shard":"touch-base","minutes":30},{"shard":"touch-chivalry","minutes":30},
         {"shard":"play-to-end","minutes":40},{"shard":"trade","minutes":40},{"shard":"withdraw","minutes":30},
         {"shard":"reach","minutes":30},{"shard":"online","minutes":30},
         {"shard":"friends-base","minutes":60},{"shard":"friends-chivalry","minutes":75},
         {"shard":"layout-base","minutes":60},{"shard":"layout-chivalry","minutes":60},{"shard":"layout-cutout","minutes":60},
         {"shard":"names","minutes":30},{"shard":"colours","minutes":30},{"shard":"update","minutes":30}]
